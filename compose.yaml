name: Lattice

services:
    postgres:
        image: postgres:17-alpine
        container_name: lattice-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            -   "127.0.0.1:${POSTGRES_PORT}:6632"
        volumes:
            -   lattice-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
                ]
            interval: 5s
            timeout: 3s
            retries: 3

volumes:
    lattice-postgres-data: